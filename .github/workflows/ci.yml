name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # So a new toolchain can be tried without an empty commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by digest, not by tag: this port runs for months and a silent toolchain bump would
  # surface as an unrelated failure at the worst possible moment. Bump deliberately.
  SWIFT_IMAGE: swift:6.4.0-noble@sha256:64bab762bc73a3fda6d9ebc559258bd6d7660c10a705bb25ecacad2f99d066f9

jobs:
  # The eight pixel kernels are the only part of the macOS renderer that ports verbatim, so they
  # are the first thing CI pins down. This job is deliberately cheap and has no system
  # dependencies — it should stay the fastest signal in the pipeline.
  c-kernels:
    name: C engine
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.0-noble@sha256:64bab762bc73a3fda6d9ebc559258bd6d7660c10a705bb25ecacad2f99d066f9
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      # An explicit pass with -Werror, separate from the build, so a warning fails with a message
      # that points straight at the line. gnu11 is the floor: HealPixels.c uses M_PI, which strict
      # -std=c11 hides behind __STRICT_ANSI__.
      - name: Warning gate
        run: |
          clang -fsyntax-only -std=gnu11 -Wall -Wextra -Werror \
            -ISources/CCompositorKernels/include \
            Sources/CCompositorKernels/*.c
          clang -fsyntax-only -std=gnu11 -Wall -Wextra -Werror \
            -ISources/CCompositorRaster/include \
            Sources/CCompositorRaster/*.c

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Warnings are failures. A 10-month port accumulates them silently otherwise, and the
      # first one to matter will be buried under fifty that do not.
      # `shell: bash` is required: the container's default `sh` is dash, which has no
      # pipefail, and without it `tee` would swallow a failing build's exit code.
      - name: Build (debug)
        shell: bash
        run: |
          set -o pipefail
          swift build -c debug 2>&1 | tee build.log
          ! grep -q 'warning:' build.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          swift test -c debug 2>&1 | tee test-debug.log

      # The kernels are hand-written pointer code. Optimised builds are where aliasing and
      # out-of-bounds assumptions actually bite, so release is not optional here.
      - name: Build and test (release)
        shell: bash
        run: |
          set -o pipefail
          swift build -c release
          swift test -c release 2>&1 | tee test-release.log

      # swift-testing runs each test target as its own process and prints one summary per
      # target, so a run's totals and its failures are scattered through thousands of lines of
      # per-test chatter. Pulling just those lines out, last, puts them where a log tail can
      # reach them -- which is the only way this port's author can read them at all, since the
      # full log archive lives behind a host this environment cannot fetch.
      - name: Summary
        if: always()
        shell: bash
        run: |
          for log in test-debug.log test-release.log; do
            [ -f "$log" ] || { echo "== $log: not produced =="; continue; }
            echo "== $log =="
            # Alternation rather than a bracket expression: the container has no UTF-8 locale
            # set, so grep compares bytes and a bracket class over multi-byte glyphs would
            # match their individual bytes anywhere.
            grep -E '✘|error:|Note: Some test targets|Test run with' "$log" \
              || echo "  nothing matched -- the run produced no summary at all"
          done

  # Answers the two questions Milestone 2's design rests on: what geometry Foundation already vends
  # on Linux, and whether a SwiftPM target may be called CoreGraphics. Reports rather than gates --
  # a FAIL in its output is a finding, and the job stays green either way.
  toolchain-probe:
    name: Toolchain probe
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.0-noble@sha256:64bab762bc73a3fda6d9ebc559258bd6d7660c10a705bb25ecacad2f99d066f9
    steps:
      - uses: actions/checkout@v4
      - run: bash Spikes/probe-linux-swift.sh
